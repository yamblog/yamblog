version: 2
updates:
  # Bun workspaces: the root bun.lock covers packages/*, website and examples/*.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days after a release before proposing it (matches bunfig.toml's
    # minimumReleaseAge) so malicious/broken releases can be yanked first.
    cooldown:
      default-days: 3
    # Only touch a declared range when the new version falls outside it, so
    # minor/patch updates stay lockfile-only and don't silently change the
    # dependency ranges of our published packages.
    versioning-strategy: increase-if-necessary
    ignore:
      # Our own packages are versioned by Changesets — never let Dependabot
      # bump them.
      - dependency-name: '@yamblog/*'
      # zod 4 changes the peer range of core and astro, which breaks every
      # current user; it is planned for their next major (see the audit notes
      # in the 2.2.0 changelog). Remove this entry when that work starts.
      - dependency-name: zod
        update-types:
          - version-update:semver-major
    # At most two PRs a week for this ecosystem: one with every minor and
    # patch update, one with every major update. Majors are kept apart so a
    # breaking upgrade never blocks the routine ones.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # One PR a week with every action update, majors included: actions are
    # pinned by SHA and exercised by CI on the PR itself.
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci(deps)
