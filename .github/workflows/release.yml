name: Release

# Publishes to npm when a release tag (v2.0.0, v2.1.3, …) is pushed.
# Prerequisite: versions must already be applied on main — run
# `bun run version:packages` and merge that PR first (see RELEASING.md).
#
# Publishing uses npm trusted publishing (OIDC) — no long-lived npm token.
# Each @yamblog/* package must have this workflow configured as its trusted
# publisher on npmjs.com (see RELEASING.md). Provenance attestations are
# generated automatically.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Unprivileged: install, build and test, then hand the built dist/ folders
  # to the publish job. No OIDC token or write access is available here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Astro 7.4 (website, with-astro) requires Node >= 22.23.4.
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Guard against unapplied changesets
        shell: bash
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [[ "$pending" != "0" ]]; then
            echo "::error::$pending unapplied changeset(s) found — run 'bun run version:packages' and merge the version PR before tagging."
            exit 1
          fi

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test:packages

      - name: Upload package builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # push per-package tags and create the GitHub release
      contents: write
      # npm trusted publishing (OIDC) + provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          # Don't restore the bun binary from the cache shared with the
          # unprivileged build job: a poisoned cache entry would run with
          # this job's id-token/contents-write permissions.
          no-cache: true

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      # No `registry-url`: that would write an _authToken line to .npmrc,
      # and we want npm to authenticate via OIDC instead.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [[ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "::error::npm $v is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi

      # Only the changesets CLI is needed here — no lifecycle scripts, no build.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download package builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: packages

      # `changeset publish` publishes every workspace package whose version
      # is not yet on npm, and creates per-package git tags for them.
      - name: Publish to npm
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Push per-package tags
        run: git push origin --tags

      - name: Create GitHub release
        # Idempotent: re-runs and manually pre-created releases are fine
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
