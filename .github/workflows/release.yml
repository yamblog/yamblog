name: Release

# Publishes to npm when a release tag is pushed. Tag scheme (see RELEASING.md):
#   release-YYYY-MM-DD        e.g. release-2026-11-20
#   release-YYYY-MM-DD.N      a second release on the same day
#   vX.Y.Z                    legacy scheme, still accepted
# Packages are versioned independently; the tag names the release, not a
# package version. Prerequisite: versions must already be applied on main —
# run `bun run version:packages` and merge that PR first.
#
# Publishing uses npm trusted publishing (OIDC) with STAGED publishing: this
# workflow uploads the new versions to npm's stage queue and a maintainer
# approves them by hand. No npm token is involved.
# Each @yamblog/* package must have this workflow configured as its trusted
# publisher on npmjs.com (see RELEASING.md). Provenance attestations are
# generated automatically.
#
# The guards in the build job below only catch accidents: a tag pushed on a
# feature-branch commit runs that commit's copy of this file, so anyone who
# can push tags can remove them. The security control is GitHub-side: the
# `npm-publish` environment's required reviewers and deployment tag rule,
# plus a tag ruleset (see RELEASING.md, "Repository settings").
on:
  push:
    tags:
      - 'release-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
      - 'release-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Unprivileged: install, build and test, then hand the built dist/ folders
  # to the publish job. No OIDC token or write access is available here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      # Accident guards (not a security boundary — see the header comment).
      - name: Guard tag name and tagged commit
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(release-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match the release tag scheme (release-YYYY-MM-DD[.N] or vX.Y.Z)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Tag the merged version-packages commit on main."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 (website, with-astro) requires Node >= 22.23.4.
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Guard against unapplied changesets
        shell: bash
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [[ "$pending" != "0" ]]; then
            echo "::error::$pending unapplied changeset(s) found — run 'bun run version:packages' and merge the version PR before tagging."
            exit 1
          fi

      - name: Guard against a release with nothing to publish
        shell: bash
        run: |
          unpublished=0
          for manifest in packages/*/package.json; do
            read -r name version private < <(node -e 'const p=require("./"+process.argv[1]);console.log(p.name,p.version,p.private===true)' "$manifest")
            [[ "$private" == "true" ]] && continue
            if [[ -z "$(npm view "$name@$version" version 2>/dev/null)" ]]; then
              echo "$name@$version is not on npm yet"
              unpublished=$((unpublished + 1))
            fi
          done
          if [[ "$unpublished" == "0" ]]; then
            echo "::error::Every package version on this commit is already on npm; nothing to release. Did you forget to merge the version-packages PR?"
            exit 1
          fi

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test:packages

      - name: Upload package builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  # Stages (does not publish) each package version that is not on npm yet.
  # A staged version only becomes installable after a maintainer approves it
  # on npmjs.com or with `npm stage approve` (2FA), so nothing this workflow
  # does can ship a release on its own. The trusted publisher on npmjs.com is
  # configured stage-only ("Allow npm publish" unticked). Tags and the GitHub
  # release are created afterwards by release-finalize.yml.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing (OIDC) + provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # No `registry-url`: that would write an _authToken line to .npmrc,
      # and we want npm to authenticate via OIDC instead.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # `npm stage` needs npm >= 11.15.0. Use the runner's npm when it is new
      # enough; otherwise install a pinned release (no lifecycle scripts).
      - name: Ensure npm supports staged publishing
        shell: bash
        run: |
          v=$(npm --version)
          echo "runner npm $v"
          if [[ "$(printf '%s\n' 11.15.0 "$v" | sort -V | head -1)" != "11.15.0" ]]; then
            npm install --global --ignore-scripts npm@11.21.3
            echo "installed npm $(npm --version)"
          fi

      # No dependency install and no build here: the job only needs Node, npm
      # and the dist/ folders built by the unprivileged job above.
      - name: Download package builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: packages

      - name: Stage packages on npm
        run: node scripts/stage-publish.mjs

      - name: Next steps
        run: |
          {
            echo "### Staged, not published"
            echo "The new versions are waiting for approval and are **not installable yet**."
            echo "1. Approve each package on npmjs.com (package page → staged versions), or with \`npm stage list\` and \`npm stage approve <stage-id>\`."
            echo "2. Run the **Finalize release** workflow with tag \`$GITHUB_REF_NAME\` to push per-package tags and create the GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"
