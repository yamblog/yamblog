name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      since:
        description: Git ref to diff from
        required: false
        type: string
      all:
        description: Build every workspace instead of only affected ones
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Astro 7.4 (website, with-astro) requires Node >= 22.23.4.
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build affected workspaces
        shell: bash
        # Untrusted/user-supplied values go through env, never inline ${{ }}.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALL: ${{ inputs.all }}
          INPUT_SINCE: ${{ inputs.since }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_ALL" == "true" ]]; then
            bun run build:changed -- --all
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_SINCE" ]]; then
            bun run build:changed -- --since "$INPUT_SINCE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            bun run build:changed -- --since "origin/$BASE_REF"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            bun run build:changed -- --since "$BEFORE_SHA"
          else
            bun run build:changed -- --all
          fi

      # `bun run test` builds all packages first — adapter tests import
      # @yamblog/core from its dist output, so a full build must exist.
      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

# Publishing is tag-triggered — see .github/workflows/release.yml and RELEASING.md.
